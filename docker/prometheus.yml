global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: dispatch
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /etc/prometheus/prometheus.token
    static_configs:
      - targets: ["app:8080"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
