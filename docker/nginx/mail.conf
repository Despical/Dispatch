# This file replaces /opt/mailserver/acme-nginx.conf in the shared TikFetch
# Nginx container when Dispatch is deployed. Keep the ACME location: the
# existing mail server renews its certificate through this webroot.
server {
    listen 80;
    server_name mail.despical.dev;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mail.despical.dev;

    ssl_certificate /etc/letsencrypt/live/mail.despical.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.despical.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    # Compress the public CSS and JavaScript before they cross mobile networks.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    location ^~ /actuator/ {
        return 404;
    }

    location = /bootstrap {
        return 404;
    }

    location = /api/auth/bootstrap {
        return 404;
    }

    location / {
        resolver 127.0.0.11 valid=10s;
        set $dispatch_upstream http://dispatch-app:8080;
        proxy_pass $dispatch_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
